# PumpTV web/runtime config.
# Copy to .config.toml for the web process.
# Keep web-only launcher/server settings here. Do not copy a web port into
# .worker.toml; bgrun manages the worker as a separate portless process.

# Example web launcher values. bgrun flattens TOML sections to env vars.
# If your TradJS deployment uses a different port variable/section, keep that
# web-only setting in this file.
[server]
port = 3006

[pumptv]
db_path = ".data/pumptv.sqlite" # must match .worker.toml
room = "main"                  # must match .worker.toml
admin_token = ""
# Optional operator CLI target. When set, `bun run control -- ...` and `bun run reset -- ...` use the remote admin API.
# Pass --local to either command to explicitly touch this machine's SQLite DB instead.
admin_url = ""
resolution = "480P"

# Episode 1 opening premise. This is generated without a viewer proposal. Keep
# it broad enough that later community ideas are not trapped in a fixed setting.
opening_prompt = "Begin in absolute emptiness: a silent black void with no stars, no objects, no characters, and no readable text. A single faint point of light appears, then expands like the first instant of a newborn universe. Matter, color, depth, and motion emerge from nothing as the world begins to exist. Cinematic, mysterious, physically grounded, no logos."

# Browser state transport.
long_poll_check_ms = 400
long_poll_timeout_ms = 25000
viewer_ttl_ms = 45000

# Automatic next-episode decision. One independent idea gets 20s. The first
# challenger starts a fresh 20s ballot. Votes never alter the deadline; a new
# late candidate gets a bounded grace period instead of making the clock jump.
solo_decision_ms = 20000
voting_window_ms = 20000
voting_new_idea_grace_ms = 10000

# Latency hiding. A speculative render never closes voting or mutates canon; it
# is promoted only if the exact proposal/text actually wins. Solo rounds can
# prewarm immediately for the full 20s head start. In already-contested rounds,
# begin at most one speculative render when the ballot is near closing.
prewarm_enabled = 1
prewarm_solo_immediate = 1
prewarm_voting_lead_ms = 12000
prewarm_lease_ttl_ms = 30000

# Optional Solana/Pump.fun compatibility. MetaMask web participants are one-wallet/one-vote;
# these fields no longer control the browser wallet score.
token_mint = ""
solana_rpc_url = "https://api.mainnet-beta.solana.com"
wallet_score_cache_ms = 20000

# Web participation uses MetaMask / EVM wallet identity. Robinhood Chain is an
# EVM L2 whose native currency is ETH. Mainnet is chain 4663; use 46630 + the
# testnet RPC while validating payouts before enabling real rewards.
robinhood_chain_id = 4663
robinhood_rpc_url = "https://rpc.mainnet.chain.robinhood.com"
robinhood_explorer_url = "https://robinhoodchain.blockscout.com"

# Each winning idea with a connected MetaMask wallet receives approximately
# this USD value, paid as native ETH on Robinhood Chain. The worker quotes
# ETH/USD immediately before sending, persists the exact wei amount, then sends.
winner_reward_usd = 1.00
reward_eth_usd_url = "https://api.coinbase.com/v2/prices/ETH-USD/spot"
reward_price_cache_ms = 60000
reward_price_retry_ms = 30000
reward_sending_stale_ms = 180000
# The payout signing key does NOT belong in the web config. Put
# PUMPTV_REWARD_PRIVATE_KEY in .worker.toml only; see .worker.example.toml.

# Shared worker ownership/health settings used by the web process.
web_heartbeat_ttl_ms = 6000

# Lightweight proposal/vote moderation. IP addresses are never stored raw;
# PumpTV stores only an HMAC hash in a separate moderation SQLite file.
# Enable proxy headers only when your reverse proxy overwrites CF-Connecting-IP,
# X-Real-IP, or X-Forwarded-For from the real client connection.
moderation_db_path = ".data/pumptv-moderation.sqlite"
moderation_secret = ""
trust_proxy_headers = 0
# First participation is immediate. Subsequent rapid writes from the same
# network are throttled; normal edits/votes remain usable after a few seconds.
proposal_ip_cooldown_ms = 8000
vote_ip_cooldown_ms = 2500

[measure]
silent = 0
timestamps = 1