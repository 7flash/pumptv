# PumpTV generation worker config.
# Copy to .worker.toml. This file intentionally has NO server/port section.
# src/server/worker-manager.ts passes it explicitly to bgrun's SDK.

[fal]
key = ""

[jsx_ai]
runtime = "codex"
model = "gpt-5.4"

[pumptv]
db_path = ".data/pumptv.sqlite"
room = "main"
resolution = "480P"

min_generation_interval_ms = 0
lease_ttl_ms = 30000
web_heartbeat_ttl_ms = 6000
worker_heartbeat_ms = 1000
idle_poll_ms = 500
error_backoff_ms = 2000

# Optional Pump.fun ingress. Leave blank when proposals only come from the web.
pumpfun_mint = ""
pumpfun_prefix = "!next"
pumpfun_vote_prefix = "!vote"
max_proposals_per_round = 40
pumpfun_lease_ttl_ms = 30000
pumpfun_lease_poll_ms = 1000
pumpfun_max_prompt_length = 500
pumpfun_user_cooldown_ms = 0

[measure]
silent = 0
timestamps = 1
