# PumpTV generation worker config.
# Copy to .worker.toml. This file intentionally has NO server/port section.
# src/server/worker-manager.ts passes it explicitly to bgrun's SDK.

[fal]
key = ""

[jsx_ai]
runtime = "codex"
model = "gpt-5.4"

# Optional but recommended. Used only by the generation worker to resolve
# current/obscure viewer references before the showrunner stages the shot.
[exa]
api_key = ""

[pumptv]
db_path = ".data/pumptv.sqlite" # must match .config.toml
room = "main"                  # must match .config.toml
resolution = "480P"

min_generation_interval_ms = 0
lease_ttl_ms = 30000
web_heartbeat_ttl_ms = 6000
worker_heartbeat_ms = 1000
idle_poll_ms = 500
error_backoff_ms = 2000

[measure]
silent = 0
timestamps = 1
