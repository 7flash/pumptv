# PumpTV runtime config. bgrun reads this file from the repo root and flattens
# TOML sections into environment variables.

[fal]
key = ""

# jsx-ai owns runtime selection and authentication.
# bgrun flattens these to JSX_AI_RUNTIME / JSX_AI_MODEL.
[jsx_ai]
runtime = "codex"
model = "gpt-5.6"

[pumptv]
db_path = ".data/pumptv.sqlite"
room = "main"
admin_token = ""
resolution = "480P"

min_generation_interval_ms = 0
lease_ttl_ms = 30000
web_heartbeat_ttl_ms = 6000
timeline_window = 96
idle_poll_ms = 500
error_backoff_ms = 2000

# Next-episode decision policy. The first independent participant gets 20s.
# The first challenger starts a fresh 20s ballot. Votes never change the clock;
# a genuinely new late candidate only gets enough grace to be votable.
solo_decision_ms = 20000
voting_window_ms = 20000
voting_new_idea_grace_ms = 10000

# Latency hiding. A speculative render never closes voting or mutates canon; it
# is promoted only if the exact proposal/text actually wins. Solo rounds can
# prewarm immediately for the full 20s head start. In already-contested rounds,
# begin at most one speculative render when the ballot is near closing.
prewarm_enabled = 1
prewarm_solo_immediate = 1
prewarm_voting_lead_ms = 12000
prewarm_lease_ttl_ms = 30000

# Browser state transport uses long polling. Only meaningful changes trigger a
# full measured state query; idle requests return after the timeout.
long_poll_check_ms = 400
long_poll_timeout_ms = 25000
viewer_ttl_ms = 45000

# Token mint used for Phantom holding-weight. This is independent of chat.
token_mint = ""

# Web participation identity/moderation. Enable trusted proxy headers only when
# the app is actually behind a proxy you control (e.g. Cloudflare/nginx).
moderation_db_path = ".data/pumptv-moderation.sqlite"
moderation_secret = ""
trust_proxy_headers = 0
proposal_ip_cooldown_ms = 8000
vote_ip_cooldown_ms = 2500

# Optional Pump.fun live-chat ingestion. Leave blank when the web proposal board
# is the only input source; disabled chat is not treated as an error.
pumpfun_mint = ""
pumpfun_prefix = "!next"
pumpfun_vote_prefix = "!vote"
vote_window_ms = 15000
max_proposals_per_round = 40
pumpfun_lease_ttl_ms = 30000
pumpfun_lease_poll_ms = 1000
pumpfun_max_prompt_length = 500
pumpfun_user_cooldown_ms = 0
solana_rpc_url = "https://api.mainnet-beta.solana.com"
wallet_score_cache_ms = 20000

# PumpTV forces measure-fn output on in src/server/observability.ts.
[measure]
timestamps = 1